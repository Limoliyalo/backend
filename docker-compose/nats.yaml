services:
  nats:
    image: nats:2.10
    container_name: healthity-nats
    # -js enables JetStream — required for PullBasedJetStreamBroker
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"   # client connections
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"  # HTTP monitoring endpoint
    volumes:
      - nats_data:/data
    networks:
      - backend_network

  taskiq-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: healthity-taskiq-worker
    command: >
      taskiq worker src.worker:broker
      --tasks-pattern "src/infrastructure/tasks/*.py"
      --log-level INFO
    env_file:
      - ../.env
    depends_on:
      - nats
      - redis
    volumes:
      - ..:/app
    networks:
      - backend_network

  taskiq-scheduler:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: healthity-taskiq-scheduler
    command: python -m src.scheduler_runner
    env_file:
      - ../.env
    depends_on:
      - nats
      - redis
    volumes:
      - ..:/app
    networks:
      - backend_network

volumes:
  nats_data:

networks:
  backend_network:
    name: healthity_backend_net
